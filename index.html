<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudos PEP — SPDATA SGH® Versão 25</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="ti ti-hospital"></i></div>
      <div>
        <div class="logo-text">PEP Hospital Geral</div>
        <div class="logo-sub">SPDATA SGH® Versão 25</div>
      </div>
    </div>

    <div class="nav-section-label">Estudo</div>
    <div class="nav-item active" id="nav-overview" onclick="navigate('overview')">
      <i class="ti ti-layout-grid"></i> Visão Geral
    </div>
    <div class="nav-item" id="nav-chat" onclick="navigate('chat')">
      <i class="ti ti-message-circle"></i> Assistente IA
    </div>

    <div class="nav-section-label">Módulos</div>
    <div class="nav-item" id="nav-permissoes" onclick="navigate('permissoes')"><i class="ti ti-shield-check"></i> Permissões</div>
    <div class="nav-item" id="nav-parametros" onclick="navigate('parametros')"><i class="ti ti-settings"></i> Parametrização</div>
    <div class="nav-item" id="nav-prescricao" onclick="navigate('prescricao')"><i class="ti ti-pill"></i> Prescrição</div>
    <div class="nav-item" id="nav-enfermagem" onclick="navigate('enfermagem')"><i class="ti ti-stethoscope"></i> Enfermagem</div>
    <div class="nav-item" id="nav-exames" onclick="navigate('exames')"><i class="ti ti-microscope"></i> Exames</div>
    <div class="nav-item" id="nav-templates" onclick="navigate('templates')"><i class="ti ti-file-text"></i> Templates / Anamnese</div>
    <div class="nav-item" id="nav-assinatura" onclick="navigate('assinatura')"><i class="ti ti-signature"></i> Assinatura Digital</div>
    <div class="nav-item" id="nav-alta" onclick="navigate('alta')"><i class="ti ti-logout"></i> Alta / Encerramento</div>
    <div class="nav-item" id="nav-especiais" onclick="navigate('especiais')"><i class="ti ti-sparkles"></i> Rotinas Especiais</div>
  </aside>

  <main class="main" id="main"></main>
</div>

<!-- Optional fallback: manual_data.js can set window.FULL_MANUAL_TEXT -->
<script src="manual_data.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
