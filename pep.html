<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudos PEP — SPDATA SGH® Versão 25</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface2: #f0f2f5;
    --border: #e0e4eb;
    --text: #1a1d23;
    --text2: #5a6070;
    --text3: #9aa0ad;
    --accent: #185FA5;
    --accent-bg: #e8f0fb;
    --accent-text: #0c447c;
    --radius: 10px;
    --radius-sm: 6px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

  .app { display: flex; height: 100vh; }

  /* SIDEBAR */
  .sidebar {
    width: 230px; min-width: 230px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .sidebar-logo {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .logo-icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
  }
  .logo-icon i { color: white; font-size: 20px; }
  .logo-text { font-size: 13px; font-weight: 600; color: var(--text); }
  .logo-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }

  .nav-section-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--text3); padding: 12px 16px 4px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 16px; font-size: 13px;
    cursor: pointer; color: var(--text2);
    border-left: 2px solid transparent;
    transition: background 0.12s, color 0.12s;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active {
    background: var(--accent-bg);
    color: var(--accent-text);
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .nav-item i { font-size: 16px; flex-shrink: 0; }

  /* MAIN */
  .main { flex: 1; overflow-y: auto; }
  .content-wrap { padding: 24px; max-width: 780px; }

  .page-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
  }
  .back-btn {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text2);
    border: 1px solid var(--border);
  }
  .back-btn:hover { background: var(--surface2); }
  .page-title { font-size: 20px; font-weight: 700; color: var(--text); }
  .page-badge {
    font-size: 11px; padding: 3px 10px;
    background: var(--accent-bg); color: var(--accent-text);
    border-radius: 20px; font-weight: 600;
  }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .card-header {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 16px; cursor: pointer;
    user-select: none;
  }
  .card-header:hover { background: var(--surface2); }
  .card-header-icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--accent-bg);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .card-header-icon i { font-size: 17px; color: var(--accent); }
  .card-header-title { font-size: 13.5px; font-weight: 600; color: var(--text); flex: 1; }
  .chevron { font-size: 16px; color: var(--text3); transition: transform 0.2s; }
  .chevron.open { transform: rotate(180deg); }

  .card-body { padding: 0 16px 14px; }
  .key-point {
    display: flex; gap: 9px; align-items: flex-start;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px; color: var(--text2); line-height: 1.55;
  }
  .key-point:last-of-type { border-bottom: none; }
  .kp-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); margin-top: 6px; flex-shrink: 0;
  }

  .tip-box {
    margin-top: 10px;
    background: #fffbeb; border: 1px solid #fde68a;
    border-radius: var(--radius-sm);
    padding: 10px 13px; font-size: 12.5px; color: #92400e;
    display: flex; gap: 8px; align-items: flex-start;
  }
  .tip-box i { font-size: 15px; flex-shrink: 0; margin-top: 1px; }

  /* MODULE GRID */
  .modules-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px; margin-bottom: 16px;
  }
  .module-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .module-card:hover { border-color: var(--accent); background: var(--accent-bg); }
  .mc-icon { font-size: 26px; color: var(--accent); margin-bottom: 10px; }
  .mc-name { font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .mc-desc { font-size: 12px; color: var(--text2); line-height: 1.45; }

  .cta-card {
    background: var(--accent-bg);
    border: 1px solid #b8d4f0;
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .cta-card i { font-size: 24px; color: var(--accent); flex-shrink: 0; }
  .cta-card .cta-title { font-size: 13.5px; font-weight: 600; color: var(--accent-text); margin-bottom: 3px; }
  .cta-card .cta-desc { font-size: 12px; color: var(--accent-text); opacity: 0.85; }
  .cta-btn {
    margin-left: auto; white-space: nowrap;
    padding: 8px 16px; background: var(--accent);
    color: white; border: none; border-radius: var(--radius-sm);
    font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .cta-btn:hover { background: #0c447c; }

  /* CHAT */
  .chat-area { display: flex; flex-direction: column; height: 100vh; }
  .chat-topbar {
    padding: 13px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    background: var(--surface);
  }
  .chat-topbar .ct-title { font-size: 15px; font-weight: 600; }
  .clear-btn {
    margin-left: auto; font-size: 12px; padding: 5px 12px;
    background: transparent; border: 1px solid var(--border);
    border-radius: var(--radius-sm); cursor: pointer; color: var(--text2);
  }
  .clear-btn:hover { background: var(--surface2); }

  .chat-messages { flex: 1; overflow-y: auto; padding: 16px 20px; }

  .chat-empty {
    text-align: center; padding: 48px 20px;
  }
  .chat-empty i { font-size: 48px; color: var(--text3); }
  .chat-empty .ce-title { font-size: 15px; font-weight: 600; color: var(--text); margin: 12px 0 6px; }
  .chat-empty .ce-desc { font-size: 13px; color: var(--text2); line-height: 1.6; max-width: 340px; margin: 0 auto; }

  .chips-area { padding: 0 20px 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px; padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface); color: var(--text2);
    cursor: pointer; transition: all 0.12s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-bg); }

  .msg { margin-bottom: 14px; }
  .msg-user { display: flex; justify-content: flex-end; }
  .msg-ai { display: flex; justify-content: flex-start; align-items: flex-end; gap: 8px; }
  .ai-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .ai-avatar i { font-size: 15px; color: white; }
  .bubble {
    max-width: 82%; padding: 10px 14px;
    border-radius: 14px; font-size: 13.5px; line-height: 1.65;
  }
  .msg-user .bubble {
    background: var(--accent); color: white;
    border-bottom-right-radius: 4px;
  }
  .msg-ai .bubble {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-bottom-left-radius: 4px;
  }
  .bubble-wrap { display: flex; flex-direction: column; align-items: flex-start; }
  .bubble-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; padding-left: 2px; }

  .typing { display: flex; align-items: center; gap: 5px; padding: 4px 2px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text3); animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  .chat-input-area {
    padding: 12px 20px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex; gap: 8px;
  }
  .chat-input-area textarea {
    flex: 1; resize: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 13px; font-size: 13.5px;
    font-family: inherit; min-height: 42px; max-height: 120px;
    outline: none; color: var(--text); background: var(--surface);
    transition: border-color 0.12s;
  }
  .chat-input-area textarea:focus { border-color: var(--accent); }
  .send-btn {
    width: 42px; height: 42px; border-radius: var(--radius);
    background: var(--accent); color: white;
    border: none; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0; transition: background 0.12s;
  }
  .send-btn:hover { background: #0c447c; }
  .send-btn:disabled { background: var(--surface2); color: var(--text3); cursor: not-allowed; }

  .bottom-hint {
    margin-top: 12px; padding: 12px 16px;
    background: var(--surface2); border-radius: var(--radius-sm);
    display: flex; align-items: center; gap: 10px;
  }
  .bottom-hint i { font-size: 18px; color: var(--text3); }
  .bottom-hint span { font-size: 12.5px; color: var(--text2); }
  .bottom-hint button {
    margin-left: auto; font-size: 12px; padding: 6px 12px;
    background: transparent; border: 1px solid var(--border);
    border-radius: var(--radius-sm); cursor: pointer; color: var(--text2);
    white-space: nowrap;
  }
  .bottom-hint button:hover { background: var(--surface); }
</style>
</head>
<body>

  <main class="main" id="main"></main>

const PEP_CONTEXT = `Você é um assistente especialista no Manual do PEP (Prontuário Eletrônico do Paciente) Hospital Geral — SPDATA SGH® Versão 25.

CONTEÚDO PRINCIPAL DO MANUAL:

1. INTRODUÇÃO: O PEP é um módulo destinado ao preenchimento de dados e informações de saúde do paciente. Mantém a segurança do paciente, arquiva dados de relevância e automatiza o trabalho dos profissionais.

2. PERMISSÕES: Dois requisitos mínimos: (a) Permissão do grupo ao módulo PEP via SGH > Permissões > P.E.P; (b) Cadastro e vinculação do CBO ao usuário. Dados obrigatórios do profissional: Nome, CPF, CBO, competência, UF, Conselho profissional e Nº conselho. Vinculação: SGH > Usuários > Manutenção de Papéis > opção 4 – Operador do Sistema.

3. PARAMETRIZAÇÃO: Parâmetros I incluem: controlar checagem de enfermagem (itens checados vão ao Balanço Hídrico), checar somente itens assinados, realizar aprazamento pela enfermagem (ativa para todos os setores), tolerância para lançamento atrasado (máx. 2h), validar duplicidade de medicamentos (por item ou princípio ativo). Sempre clicar em 'Confirmar' após alterações. Integrações com estoque: requisição de saída ou dispensação por horário; validar antimicrobiano ativa a rotina de ATB. Parâmetros de impressão: logotipo, horários, modo zebrado, frente e verso, tamanho da fonte.

4. PRESCRIÇÃO GERAL (Cap 5): Tipos: medicamentos, soluções EV, procedimentos clínicos, dietas (livre, oral, enteral, parenteral, jejum), hemocomponentes, respiração espontânea, nível de atividade. Frequência 24/24h adicionada na V.01/26. Kits de medicamentos e soluções EV contínua podem ser configurados. Validações: duplicidade, alergia CBARA, antimicrobiano, índice prognóstico. Protocolos padrão podem ser criados.

5. CHECAGEM DE ENFERMAGEM (Cap 8, 11): Aprazamento ativa para todos os setores (não pode ser específico). V.02/25 implementou checagem por código de barras com rastreabilidade em tempo real. Balanço Hídrico registra entradas/saídas; horários de fechamento configuráveis.

6. EXAMES (Cap 12): Solicitação dentro do prontuário. Kits de exames para solicitar grupos. Integração com laboratórios terceiros via Web Service. Alerta de exames liberados configurável.

7. TEMPLATES E ANAMNESE (Cap 16, 17): Templates com perguntas variadas (CID10, texto livre, procedimentos, etc.). Anamnese pode ser obrigatória antes da prescrição. Resumo clínico pode abrir automaticamente.

8. ASSINATURA DIGITAL (Cap 52, 56): Tipos: A1 (arquivo local), A3 (token), SafeWeb (nuvem), Valid (nuvem). Habilitação por usuário possível. Assinatura em lote para pendências acumuladas. Assinatura digital do paciente via Portal de Assinatura. Estagiários só salvam; supervisor confirma.

9. ALTA (Cap 45, 55): Provisionar alta: previsão de data. Alta médica: decisão clínica. Alta hospitalar: finaliza internação. RAC (V.01/26): Registro de Atendimento Clínico para ambulatório.

10. ONCOLOGIA (Cap 27): Protocolos com cálculo de dose por superfície corporal. Agenda de quimioterapia com ciclos/sessões. Validação farmacêutica. Integração com estoque ao planejar/prescrever/validar.

11. OUTRAS ROTINAS: Oftalmologia (laudos e exames), AIH (laudo obrigatório em até 24h/48h configurável), APAC (procedimentos alta complexidade), Índice Prognóstico (APACHE II, SOFA), Notificação Compulsória (ativada por CID, envio por e-mail), Partograma, Curva de Crescimento Infantil, Interconsulta, Encaminhamento, Processo de Enfermagem (SAE), Ficha Anestésica.

Responda em português do Brasil. Seja claro, didático e objetivo. Use formatação simples.`;

let currentView = 'overview';
let chatMessages = [];
let isLoading = false;
const expanded = {};

function navigate(view) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('nav-' + view);
  if (el) el.classList.add('active');
  currentView = view;
  render();
}

function toggleCard(id) {
  expanded[id] = !expanded[id];
  const body = document.getElementById('cb-' + id);
  const chev = document.getElementById('chev-' + id);
  if (body) body.style.display = expanded[id] ? 'block' : 'none';
  if (chev) chev.className = 'chevron ti ti-chevron-down' + (expanded[id] ? ' open' : '');
}

function render() {
  const main = document.getElementById('main');
  if (currentView === 'overview') renderOverview(main);
  else if (currentView === 'chat') renderChat(main);
  else renderModule(main, currentView);
}

function renderOverview(container) {
  const data = CONTENT.overview;
  const grid = data.modules.map(m => `
    <div class="module-card" onclick="navigate('${m.nav}')">
      <div class="mc-icon"><i class="ti ${m.icon}"></i></div>
      <div class="mc-name">${m.name}</div>
      <div class="mc-desc">${m.desc}</div>
    </div>`).join('');

  container.innerHTML = `<div class="content-wrap">
    <div class="page-header">
      <div class="page-title">${data.title}</div>
      <div class="page-badge">${data.badge}</div>
    </div>
    <p style="font-size:13.5px;color:var(--text2);margin-bottom:18px;line-height:1.6">O PEP (Prontuário Eletrônico do Paciente) é o módulo central do SPDATA SGH® para registrar dados de saúde do paciente. Selecione um módulo abaixo para estudar seus pontos principais.</p>
    <div class="modules-grid">${grid}</div>
    <div class="cta-card">
      <i class="ti ti-robot"></i>
      <div><div class="cta-title">Assistente IA do Manual</div><div class="cta-desc">Tire dúvidas sobre qualquer funcionalidade do PEP com o assistente de IA treinado no manual.</div></div>
      <button class="cta-btn" onclick="navigate('chat')">Abrir chat →</button>
    </div>
  </div>`;
}

function renderModule(container, view) {
  const data = CONTENT[view];
  if (!data) return;
  const sections = data.sections.map((s, i) => {
    const id = view + i;
    if (!(id in expanded)) expanded[id] = true;
    return `
      <div class="card">
        <div class="card-header" onclick="toggleCard('${id}')">
          <div class="card-header-icon"><i class="ti ${s.icon}"></i></div>
          <div class="card-header-title">${s.title}</div>
          <i class="chevron ti ti-chevron-down${expanded[id] ? ' open' : ''}" id="chev-${id}"></i>
        </div>
        <div class="card-body" id="cb-${id}" style="display:${expanded[id] ? 'block' : 'none'}">
          ${s.points.map(p => `<div class="key-point"><div class="kp-dot"></div><div>${p}</div></div>`).join('')}
          ${s.tip ? `<div class="tip-box"><i class="ti ti-bulb"></i><div><strong>Dica:</strong> ${s.tip}</div></div>` : ''}
        </div>
      </div>`;
  }).join('');

  container.innerHTML = `<div class="content-wrap">
    <div class="page-header">
      <div class="back-btn" onclick="navigate('overview')"><i class="ti ti-arrow-left"></i></div>
      <div class="page-title">${data.title}</div>
      <div class="page-badge">${data.badge}</div>
    </div>
    ${sections}
    <div class="bottom-hint">
      <i class="ti ti-message-question"></i>
      <span>Ficou com dúvidas sobre esse módulo?</span>
      <button onclick="navigate('chat')">Perguntar ao assistente →</button>
    </div>
  </div>`;
}

const CHIPS = ["Como configurar permissões de acesso?","O que é o aprazamento de enfermagem?","Como funciona a assinatura digital?","Quais os tipos de dieta no PEP?","Como ativar a checagem por código de barras?","Como funciona a alta do paciente?"];

function renderChat(container) {
  let msgsHtml = '';
  if (chatMessages.length === 0) {
    msgsHtml = `<div class="chat-empty">
      <i class="ti ti-robot"></i>
      <div class="ce-title">Assistente do Manual PEP</div>
      <div class="ce-desc">Pergunte qualquer coisa sobre o SPDATA SGH® Versão 25. Estou treinado no manual completo.</div>
    </div>`;
  } else {
    msgsHtml = chatMessages.map(m => {
      if (m.role === 'user') return `<div class="msg msg-user"><div class="bubble">${m.content}</div></div>`;
      return `<div class="msg msg-ai">
        <div class="ai-avatar"><i class="ti ti-robot"></i></div>
        <div class="bubble-wrap">
          <div class="bubble-label">PEP Assistente</div>
          <div class="bubble">${m.content.replace(/\n/g,'<br>')}</div>
        </div>
      </div>`;
    }).join('');
    if (isLoading) msgsHtml += `<div class="msg msg-ai">
      <div class="ai-avatar"><i class="ti ti-robot"></i></div>
      <div class="bubble-wrap"><div class="bubble-label">PEP Assistente</div>
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>
    </div>`;
  }

  const chipsHtml = chatMessages.length === 0 ? `<div class="chips-area">${CHIPS.map(c=>`<div class="chip" onclick="sendChip(this)">${c}</div>`).join('')}</div>` : '';

  container.innerHTML = `<div class="chat-area">
    <div class="chat-topbar">
      <div class="back-btn" onclick="navigate('overview')"><i class="ti ti-arrow-left"></i></div>
      <div class="ct-title">Assistente IA do Manual</div>
      ${chatMessages.length > 0 ? `<button class="clear-btn" onclick="clearChat()">Limpar conversa</button>` : ''}
    </div>
    <div class="chat-messages" id="msgs">${msgsHtml}</div>
    ${chipsHtml}
    <div class="chat-input-area">
      <textarea id="inp" placeholder="Pergunte sobre qualquer funcionalidade do PEP..." onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="sbtn" onclick="sendMessage()" ${isLoading?'disabled':''}><i class="ti ti-send"></i></button>
    </div>
  </div>`;

  const msgs = document.getElementById('msgs');
  if (msgs) msgs.scrollTop = msgs.scrollHeight;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function sendChip(el) {
  const text = el.textContent;
  const inp = document.getElementById('inp');
  if (inp) inp.value = text;
  sendMessage();
}

function clearChat() {
  chatMessages = [];
  render();
}

async function sendMessage() {
  const inp = document.getElementById('inp');
  if (!inp || isLoading) return;
  const text = inp.value.trim();
  if (!text) return;
  chatMessages.push({ role: 'user', content: text });
  inp.value = '';
  isLoading = true;
  render();
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: PEP_CONTEXT,
        messages: chatMessages.map(m => ({ role: m.role, content: m.content }))
      })
    });
    const data = await res.json();
    chatMessages.push({ role: 'assistant', content: data.content?.[0]?.text || "Não consegui processar a resposta." });
  } catch(e) {
    chatMessages.push({ role: 'assistant', content: "Ocorreu um erro ao conectar com o assistente. Tente novamente." });
  }
  isLoading = false;
  render();
}

render();
</script>
</body>
